name: Pinterest

on:
  schedule:
    - cron: "0 11,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publicar pins agendados
        run: node tools/pinterest/publish.js
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}

      - name: Gravar estado publicado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain tools/pinterest/state.json | grep -q .; then
            git config user.name "pinterest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tools/pinterest/state.json
            git commit -m "chore(pinterest): atualiza pins publicados"
            git push
          fi
